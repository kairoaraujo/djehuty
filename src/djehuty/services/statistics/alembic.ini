# Alembic configuration for the usage statistics database.
#
# Scoped to the SQL statistics store only. It uses its own version table
# (djehuty_statistics_alembic_version) and is independent from djehuty's RDF
# migrations under src/djehuty/schema. The database URL is not set here; it is
# provided at runtime from the djehuty configuration (see migrations/env.py).

[alembic]
script_location = %(here)s/migrations
version_table = djehuty_statistics_alembic_version

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
